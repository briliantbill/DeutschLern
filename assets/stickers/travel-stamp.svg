<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Placeholder: cap perjalanan "Travel Stamp · Deutschland". Ganti dengan ilustrasi asli, nama file tetap. -->
  <defs>
    <path id="arc-top" d="M33 80A47 47 0 0 1 127 80"/>
    <path id="arc-bottom" d="M24 80A56 56 0 0 0 136 80"/>
    <path id="star" d="M0-5L1.23-1.7 4.76-1.55 2 .65 2.94 4.05 0 2.1-2.94 4.05-2 .65-4.76-1.55-1.23-1.7Z"/>
    <clipPath id="flag-circle">
      <circle cx="80" cy="80" r="30"/>
    </clipPath>
  </defs>

  <!-- Pinggiran putih stiker -->
  <circle cx="80" cy="80" r="77" fill="#FFFFFF"/>

  <g transform="rotate(-8 80 80)">
