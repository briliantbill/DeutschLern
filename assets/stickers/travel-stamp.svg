    <circle cx="80" cy="80" r="62" fill="none" stroke="#2B2522" stroke-width="1.5" stroke-dasharray="3 3"/>

    <g font-family="Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#2B2522">
      <text><textPath href="#arc-top" startOffset="50%" text-anchor="middle">TRAVEL STAMP</textPath></text>
      <text><textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">DEUTSCHLAND</textPath></text>
    </g>

    <use href="#star" transform="translate(16 80) scale(.9)" fill="#2B2522"/>
    <use href="#star" transform="translate(144 80) scale(.9)" fill="#2B2522"/>

    <g clip-path="url(#flag-circle)">
